{% extends 'base.html' %}
{% block title %}404 - Page Not Found | NIELIT ID Card System{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 bg-white p-5 rounded shadow">
            <h1 class="display-1 text-danger font-weight-bold">404</h1>
            <h3 class="mb-3 text-dark font-weight-bold">Page Not Found</h3>
            <p class="text-muted mb-4">
                The page or ID record you are looking for does not exist or may have been moved.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="/" class="btn btn-primary px-4 font-weight-bold">Return to Portal</a>
                <a href="/list/" class="btn btn-outline-secondary px-4 font-weight-bold">Employee Directory</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
